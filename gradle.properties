# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Use only the JDK that gradlew was launched with, i.e. the one on JAVA_HOME.
#
# Without this, Gradle auto-detects "installed" JDKs from well-known locations, which
# includes VS Code extension directories. The redhat.java extension ships a trimmed
# Java 21 image that has javac and jar but no jlink. The project targets JVM 21 bytecode,
# so Gradle picks that image and hands it to AGP's JdkImageTransform, which shells out to
# jlink and fails. CI never sees this: setup-java installs only Temurin, which has jlink.
#
# Safe here because the build uses compileOptions rather than jvmToolchain(N), so no
# toolchain resolution is needed at all.
org.gradle.java.installations.auto-detect=false
